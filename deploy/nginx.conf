# =============================================================
#  GSMS Nginx 配置（Windows 部署）
#  说明：本机 80/443 已被系统进程占用，故使用 8080
#  安装路径：D:\nginx（可通过环境变量 NGINX_HOME 覆盖）
#  用法：由 deploy\start-all.bat 复制到 %NGINX_HOME%\conf\nginx.conf 后启动，
#        「include mime.types」依赖同目录下的 mime.types，请勿单独放到别处使用
# =============================================================

worker_processes  2;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 与后端 max-file-size 保持三处一致（页面清单 4.11）
    client_max_body_size 100m;

    # 日志落 E 盘，C 盘空间不足
    access_log  E:/GSMS/data/logs/nginx-access.log;
    error_log   E:/GSMS/data/logs/nginx-error.log;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    server {
        listen       8080;
        server_name  localhost;

        # 安全响应头。注意 nginx 的 add_header 不累积：子块一旦自己写了 add_header，
        # 就不再继承这里的配置，因此下方带 Cache-Control 的 location 需重复声明。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;

        # 前端构建产物
        root   E:/GSMS/web/dist;
        index  index.html;

        # history 路由：深链刷新不 404
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源长缓存（文件名带 hash）
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "same-origin" always;
        }

        # 反向代理后端
        location /api/ {
            proxy_pass http://127.0.0.1:8089;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 健康检查透传
        location /actuator/health {
            proxy_pass http://127.0.0.1:8089/actuator/health;
        }
    }

    # HTTPS（内网自签证书，按需启用）
    # server {
    #     listen 8443 ssl;
    #     server_name localhost;
    #     ssl_certificate      D:/nginx/conf/gsms.crt;
    #     ssl_certificate_key  D:/nginx/conf/gsms.key;
    #     ssl_protocols        TLSv1.2 TLSv1.3;
    #     location / { try_files $uri $uri/ /index.html; root E:/GSMS/web/dist; }
    #     location /api/ { proxy_pass http://127.0.0.1:8089; }
    # }
}
